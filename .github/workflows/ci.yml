name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  recorded-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen evidence manifests
        run: bash ./scripts/verify-recorded.sh

  reference-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: reference/phase3/pnpm-lock.yaml
      - name: Install exact reference dependencies
        working-directory: reference/phase3
        run: pnpm install --frozen-lockfile
      - name: Typecheck and deterministic tests
        working-directory: reference/phase3
        run: pnpm check
